<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AirHorizon | Book Flights</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>AirHorizon</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="book.html">Book Flights</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main>

        <div class="booking-layout">

            <!-- LEFT SIDE: SLIDESHOW -->

            <section class="slideshow booking-slideshow">

                <img src="airplane3.jpeg" class="slide active">

                <img src="airplane2.jpeg" class="slide">

                <img src="airplane1.jpeg" class="slide">

                <div class="booking-overlay">

                    <p>DISCOVER THE WORLD</p>

                    <h2>Beyond the Ordinary.</h2>

                    <p>
                        Your next destination awaits.
                        Travel with AirHorizon.
                    </p>

                </div>

            </section>


            <!-- RIGHT SIDE: BOOKING FORM -->

            <section class="booking-panel">

                <h2>Book Your Flight</h2>

                <p>PLAN YOUR NEXT JOURNEY</p>

                <form id="flightForm">

                    <label for="from">Departure City</label>

                    <input type="text" id="from"
                        placeholder="Enter departure city" required>


                    <label for="to">Destination City</label>

                    <input type="text" id="to"
                        placeholder="Enter destination city" required>


                    <label for="date">Departure Date</label>

                    <input type="date" id="date" required>


                    <label for="passengers">Passengers</label>

                    <input type="number" id="passengers"
                        min="1" max="9" value="1" required>


                    <button type="submit">SEARCH FLIGHTS</button>

                </form>

                <div id="flightResults"></div>

            </section>

        </div>

    </main>


    <footer>

        <p>
            &copy; 2026 AirHorizon Airlines.
            All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
